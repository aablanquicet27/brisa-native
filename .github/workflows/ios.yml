# Brisa para iPhone: genera el proyecto con Capacitor, firma con fastlane match (repo privado brisa-certs)
# y sube a TestFlight (solo prueba interna) con la llave de App Store Connect.
name: iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: git@github.com:aablanquicet27/brisa-certs.git
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - name: Revisar llave de Apple
        working-directory: .
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Falta la llave de Apple (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8). Súbela con el formulario y vuelve a correr."; exit 1
          fi
          if [ -z "$MATCH_PASSWORD" ]; then echo "::error::Falta MATCH_PASSWORD"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: native

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)"
          xcodebuild -version

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar proyecto iOS
        run: npm run platform:ios

      - name: Compilar y subir a TestFlight
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            native/build/*.ipa
            ~/Library/Logs/gym/*.log
          retention-days: 14
          if-no-files-found: ignore
