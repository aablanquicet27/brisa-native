# Brisa para Android: genera el proyecto con Capacitor, compila el APK de release, lo firma y lo publica como Release.
name: Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Revisar llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PASS" ] || [ -z "$ALIAS" ]; then echo "::error::Falta la llave de firma de Android en los secretos"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar proyecto Android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run platform:android

      - name: Compilar APK (release)
        working-directory: native/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Firmar APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "$KS" | base64 -d > "$RUNNER_TEMP/brisa.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          OUT="$GITHUB_WORKSPACE/Brisa-${{ github.run_number }}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/brisa.p12" --ks-type PKCS12 --ks-pass env:PASS --ks-key-alias "$ALIAS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          rm -f "$RUNNER_TEMP/brisa.p12"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Brisa-${{ github.run_number }}
          path: Brisa-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" "Brisa-${{ github.run_number }}.apk" --prerelease --target "${{ github.sha }}" \
            --title "Brisa Android ${{ github.run_number }}" \
            --notes "APK de Brisa para Android (compilación ${{ github.run_number }}). Descárgalo desde el teléfono e instálalo; ver native/LEEME.md."
